const DOW = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDay = s => { const d = parseD(s); return DOW[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate(); };
const fmtShort = s => { const d = parseD(s); return DOW[d.getDay()].slice(0, 3) + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const mins = t => { const p = String(t).split(':').map(Number); return p[0] * 60 + (p[1] || 0); };
const tstr = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
function fmtT(t) { if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + pad(m || 0) + ' ' + ap; }
const range = (a, b) => fmtT(a) + (b ? ' – ' + fmtT(b) : '');
const peso = n => n == null ? '' : '₱' + Number(n).toLocaleString('en-PH', { maximumFractionDigits: 0 });
const memberPrice = r => r == null ? null : Math.max(0, r - 100);
function priceTxt(s) { if (s.price_regular == null) return 'Rate at the club'; return peso(s.price_regular) + ' · members ' + peso(s.price_member != null ? s.price_member : memberPrice(s.price_regular)); }
function memberActive(p) { return !!(p && p.is_member && (!p.member_until || p.member_until >= manilaToday())); }
let toastT; function toast(m, err) { const t = $('toast'); t.textContent = m; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 3200); }
const errMsg = e => (e && (e.message || e.error_description || e.msg)) || 'Something went wrong';
const sportPill = s => '<span class="pill p-' + esc(s) + '">' + esc(s === 'football' ? 'FOOTBALL' : 'PADEL') + '</span>';
const statusPill = s => '<span class="pill ' + ({ confirmed: 'p-ok', pending: 'p-warn', waitlist: 'p-warn', cancelled: 'p-mute' }[s] || '') + '">' + esc({ confirmed: 'Confirmed', pending: 'Awaiting confirmation', waitlist: 'Waitlist', cancelled: 'Cancelled' }[s] || s) + '</span>';

/* ---------- state ---------- */
const S = { user: null, profile: null, staff: false, route: 'home', sport: 'all', courtId: null, courtDate: null, courtStart: null, courtDur: 60, staffTab: 'sheet', sheetMode: 'week', sheetDate: manilaToday(), staffDate: manilaToday(), bkFilter: 'pending', memberQ: '', after: null, busy: false };
const cache = { programs: null, courts: null };

/* ---------- auth ---------- */
async function loadUser() {
  const { data } = await sb.auth.getSession();
  S.user = data.session ? data.session.user : null;
  S.profile = null; S.staff = false; S.membership = { active: false };
  if (S.user) {
    const [p, st] = await Promise.all([
      sb.from('uzu_profiles').select('*').eq('id', S.user.id).maybeSingle(),
      sb.from('uzu_staff').select('user_id').eq('user_id', S.user.id).maybeSingle()
    ]);
    S.profile = p.data; S.staff = !!st.data;
    const mm = await sb.rpc('uzu_my_membership'); S.membership = mm.data || { active: false };
  }
}
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' || ev === 'SIGNED_IN') loadUser().then(() => { renderNav(); }); });

/* ---------- data ---------- */
async function programs() { if (!cache.programs) { const { data } = await sb.from('uzu_programs').select('*').eq('active', true).order('sort'); cache.programs = data || []; } return cache.programs; }
async function courts() { if (!cache.courts) { const { data } = await sb.from('uzu_courts').select('*').eq('active', true).order('sort'); cache.courts = data || []; } return cache.courts; }
async function sessionsBetween(a, b, all) {
  let q = sb.from('uzu_sessions').select('*').gte('date', a).lte('date', b).order('date').order('start_time');
  if (!all) q = q.neq('status', 'cancelled');
  const [s, c, r] = await Promise.all([q, sb.rpc('uzu_session_counts', { p_from: a, p_to: b }), sb.rpc('uzu_public_roster', { p_from: a, p_to: b })]);
  const counts = {}; (c.data || []).forEach(x => counts[x.session_id] = x);
  const ros = {}; (r.data || []).forEach(x => ros[x.session_id] = x);
  return (s.data || []).map(x => Object.assign(x, { booked: (counts[x.id] || {}).booked || 0, waiting: (counts[x.id] || {}).waitlist || 0, names: (ros[x.id] || {}).names || [], waitnames: (ros[x.id] || {}).waitlist || [], by_level: (ros[x.id] || {}).by_level || {} }));
}
async function myBookings() {
  if (!S.user) return [];
  const { data } = await sb.from('uzu_bookings').select('*').eq('user_id', S.user.id).order('date', { ascending: false }).limit(100);
  return data || [];
}

/* ---------- router ---------- */
async function route() {
  S._lastRender = Date.now();
  const h = (location.hash || '').replace('#', ''); const [h0, arg] = h.split('/');
  S.route = ['schedule', 'courts', 'account', 'signin', 'staff', 'verify', 'pay'].includes(h0) ? h0 : 'home'; S.arg = arg || '';
  renderNav(); closeModal();
  const app = $('app');
  try {
    if (S.route === 'home') app.innerHTML = await viewHome();
    else if (S.route === 'schedule') app.innerHTML = await viewSchedule();
    else if (S.route === 'courts') app.innerHTML = await viewCourts();
    else if (S.route === 'account') app.innerHTML = await viewAccount();
    else if (S.route === 'signin') app.innerHTML = viewSignin();
    else if (S.route === 'staff') app.innerHTML = await viewStaff();
    else if (S.route === 'verify') app.innerHTML = await viewVerify();
    else if (S.route === 'pay') app.innerHTML = await viewPay();
  } catch (e) { app.innerHTML = '<div class="wrap sec"><div class="card">Couldn’t load this page: ' + esc(errMsg(e)) + '</div></div>'; }
}
const rerender = () => route();
let _lastDay = manilaToday();
function idleUI() { const a = document.activeElement; return !$('modal').innerHTML && !(a && ['INPUT', 'SELECT', 'TEXTAREA'].includes(a.tagName)); }
function liveView() { return S.route === 'home' || S.route === 'schedule' || (S.route === 'staff' && S.staffTab === 'sheet'); }
function tick(force) {
  const t = manilaToday();
  if (t !== _lastDay) { if (S.sheetDate === _lastDay) S.sheetDate = t; if (S.staffDate === _lastDay) S.staffDate = t; if (S.courtDate === _lastDay) S.courtDate = t; _lastDay = t; force = true; }
  document.querySelectorAll('.clock').forEach(e => e.textContent = nowClock());
  if (liveView() && idleUI() && (force || Date.now() - (S._lastRender || 0) > 120000)) { const y = scrollY; route().then(() => scrollTo(0, y)); }
}
setInterval(() => tick(false), 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(true); });
function go(h) { if (location.hash === '#' + h) route(); else location.hash = h; }

/* ---------- rolling feed helpers ---------- */
function relDay(d, t) { const n = Math.round((parseD(d) - parseD(t)) / 864e5); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n < 7 ? 'This ' + DOW[parseD(d).getDay()] : 'Next ' + DOW[parseD(d).getDay()]; }
function nowClock() { const m = manilaNowMins(); const h = Math.floor(m / 60), mm = m % 60; return ((h + 11) % 12 + 1) + ':' + pad(mm) + ' ' + (h < 12 ? 'AM' : 'PM'); }
function sState(date, st, en, t, now, nextId, id) {
  if (date !== t) return '';
  if (mins(en) <= now) return 'done';
  if (mins(st) <= now) return 'now';
  return id === nextId ? 'next' : '';
}
function liveTag(state, st, now) {
  if (state === 'now') return '<div class="live"><i></i>Happening now</div>';
  if (state === 'next') { const m = mins(st) - now; return '<div class="live nx">Up next · in ' + (m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60 ? m % 60 + 'm' : '') : m + 'm') + '</div>'; }
  if (state === 'done') return '<div class="live dn">Finished</div>';
  return '';
}
function feedHTML(sess, days, t, opts) {
  opts = opts || {};
  const now = manilaNowMins();
  const todays = sess.filter(s => s.date === t && mins(s.start_time) > now);
  const nextId = todays.length ? todays[0].id : null;
  return '<div class="feed">' + days.map((d, i) => {
    const list = sess.filter(s => s.date === d);
    const isT = d === t;
    const dd = parseD(d);
    let body = list.map(s => { const st = sState(s.date, s.start_time, s.end_time, t, now, nextId, s.id); return sessCard(s, st, liveTag(st, s.start_time, now)); }).join('');
    if (!list.length) body = '<div class="fempty">No club sessions' + (opts.sport && opts.sport !== 'all' ? ' for ' + opts.sport : '') + ' — courts are open 7 AM–10 PM.</div>';
    return '<div class="fday' + (isT ? ' today' : i > 0 ? ' later' : '') + '"><div class="fh"><span class="d">' + DOW[dd.getDay()] + '</span><span class="dt">' + esc(fmtShort(d).split(' ').slice(1).join(' ')) + '</span><span class="rel">' + (isT ? 'Today · <span class="clock">' + nowClock() + '</span>' : relDay(d, t)) + '</span><span class="end"><a href="#courts" data-act="courtday" data-v="' + d + '">Book a court →</a></span></div>' + body + '</div>';
  }).join('') + '</div>';
}

function highlightHTML(sess) {
  const now = manilaNowMins(), t = manilaToday();
  const s = sess.find(x => x.highlight && !(x.date === t && mins(x.end_time) <= now)); if (!s) return '';
  const left = s.capacity - s.booked; const d = parseD(s.date);
  return '<div class="hl"><div class="k">Friday plans? See you on court! 🎾</div><h3>' + esc(s.highlight) + '</h3><div>' + DOW[d.getDay()] + ', ' + ['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()] + ' ' + d.getDate() + ' · ' + esc(range(s.start_time, s.end_time)) + ' · UZU Club</div>' +
    '<p style="margin:10px 0 0;opacity:.88">Expect good rallies, rotating partners, and a little friendly competition. Whether you’re finding your game or ready to bring the heat, everyone’s welcome!</p>' +
    ((s.levels || []).length ? '<div class="lv"><span><b>Two levels. Two courts.</b></span>' + s.levels.map(l => '<span>' + esc(l) + '</span>').join('') + '</div>' : '') +
    '<div class="pr"><b>' + esc(peso(s.price_regular)) + '</b> regular &nbsp;|&nbsp; <b>' + esc(peso(s.price_member != null ? s.price_member : memberPrice(s.price_regular))) + '</b> members</div>' +
    '<div class="row wrapx" style="gap:10px"><button class="btn b-gold" data-act="' + (S.staff ? 'staffadd' : 'book') + '" data-id="' + s.id + '">' + (S.staff ? '+ Add player' : left > 0 ? 'Sign up now' : 'Join the waitlist') + '</button><span class="small" style="opacity:.85">' + (left > 0 ? left + ' of ' + s.capacity + ' spots left' : 'Full') + ' · Make it your Friday ritual — every Friday, 3–5 PM.</span></div></div>';
}

/* ---------- HOME ---------- */
async function viewHome() {
  const t = manilaToday();
  const days = Array.from({ length: 7 }, (_, i) => addDays(t, i));
  const [sess, mine] = await Promise.all([sessionsBetween(t, days[6]), myBookings()]);
  mineBySession = {}; mine.filter(b => b.status !== 'cancelled' && b.session_id).forEach(b => mineBySession[b.session_id] = b);
  S._sess = S._sess || {}; sess.forEach(s => S._sess[s.id] = s);
  return '<section class="hero"><div class="wrap">' + (ASSETS.logo ? '<img class="logo-big" src="' + ASSETS.logo + '" alt="UZU Club">' : '') + '<div class="pillars">PADEL + BISTRO &amp; BAR + FOOTBALL + RECOVERY</div><h1>One of Asia’s most <i>beautiful</i> social clubs.</h1><p>El Nido, Palawan, Philippines. Book Americanos, clinics, football and any of our three padel courts in a few taps — confirmations come straight to your email.</p><div class="btns"><a class="btn b-gold" href="#schedule">See this week’s sessions</a><a class="btn b-ghostl" href="#courts">Book a court</a></div></div></section>' +
        '<section class="sec"><div class="wrap" style="display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start" id="homegrid">' +
    '<div>' + highlightHTML(sess) + '<h2>This week at UZU</h2><p class="sub">Today first, then the days ahead. Tap Book to grab a spot.</p>' + feedHTML(sess, days, t) +
    '<a class="btn b-ghost b-full" href="#schedule" style="margin-top:14px">See the next two weeks</a></div>' +
    '<div class="side">' + '<div class="card" style="margin-top:0"><b>Become a member</b><div class="serif" style="font-size:30px;font-weight:600;line-height:1.1;margin:4px 0">₱2,000 <span style="font-size:18px">for 6 months</span></div><div class="muted small" style="margin:0 0 10px">Covers you plus up to 2 family members (spouse/partner or child). Members save ₱100 on every session and court hour. Register, tick “I want to become a member”, then pay at the club or by GCash — our staff will activate it.</div>' + (S.user ? '<a class="btn b-ghost b-sm" href="#account">My bookings</a>' : '<a class="btn b-gold b-sm" href="#signin" data-act="regtab">Create an account</a>') + '</div>' +
    '<div class="card" style="margin-top:14px"><b>For bookings</b><div class="small" style="margin-top:4px">0917 125 5048<br>info@uzuclub.com<br>@uzu.club</div></div></div>' +
    '</div></section>';
}

/* ---------- SCHEDULE ---------- */
let mineBySession = {};
function rosterHTML(s) {
  const bl = s.by_level || {}, lv = (s.levels || []).filter(l => (bl[l] || []).length);
  if (!lv.length) return '<b>Playing:</b> ' + s.names.map(esc).join(', ');
  return lv.map(l => '<b>' + esc(l) + ':</b> ' + bl[l].map(esc).join(', ')).join(' <span class="muted">·</span> ') + ((bl[''] || []).length ? ' <span class="muted">·</span> <b>Level TBC:</b> ' + bl[''].map(esc).join(', ') : '');
}
function sessCard(s, state, tag) {
  const left = s.capacity - s.booked, pct = Math.min(100, Math.round(s.booked / Math.max(1, s.capacity) * 100));
  const mine = mineBySession[s.id];
  const started = s.date === manilaToday() && mins(s.start_time) <= manilaNowMins();
  let act;
  if (S.staff) act = started ? '<span class="pill p-mute">In progress</span>' : '<button class="btn b-ghost b-sm" data-act="staffadd" data-id="' + s.id + '">+ Add player</button>';
  else if (mine) act = statusPill(mine.status) + '<button class="btn b-ghost b-sm" data-act="cancel" data-id="' + mine.id + '">Cancel</button>';
  else if (s.status === 'closed') act = '<span class="pill p-mute">Bookings closed</span>';
  else if (started) act = '<span class="pill p-mute">In progress</span>';
  else act = '<button class="btn ' + (left > 0 ? 'b-green' : 'b-ghost') + ' b-sm" data-act="book" data-id="' + s.id + '">' + (left > 0 ? 'Book' : 'Join waitlist') + '</button>';
  return '<div class="sess' + (state ? ' ' + state : '') + '"><div class="time">' + esc(fmtT(s.start_time)) + '<div class="muted small" style="font-weight:500">to ' + esc(fmtT(s.end_time)) + '</div></div>' +
    '<div class="info">' + (tag || '') + '<div class="ttl">' + esc(s.title) + '</div><div class="meta">' + esc(s.audience || '') + (s.audience ? ' · ' : '') + esc(priceTxt(s)) + '</div>' +
    '<div class="row" style="margin-top:6px;gap:8px">' + sportPill(s.sport) + '<div class="bar"><i style="width:' + pct + '%"></i></div><span class="spots">' + (left > 0 ? left + ' of ' + s.capacity + ' spots left' : 'Full' + (s.waiting ? ' · ' + s.waiting + ' waiting' : '')) + '</span></div>' + (s.names && s.names.length ? '<div class="roster">' + rosterHTML(s) + (s.waitnames && s.waitnames.length ? ' <b>· Waitlist:</b> ' + s.waitnames.map(esc).join(', ') : '') + '</div>' : '') + '</div>' +
    '<div class="act">' + act + '</div></div>';
}
async function viewSchedule() {
  const t = manilaToday(), end = addDays(t, 13);
  const [sess, mine] = await Promise.all([sessionsBetween(t, end), myBookings()]);
  mineBySession = {}; mine.filter(b => b.status !== 'cancelled' && b.session_id).forEach(b => mineBySession[b.session_id] = b);
  S._sess = {}; sess.forEach(s => S._sess[s.id] = s);
  const list = sess.filter(s => S.sport === 'all' || s.sport === S.sport);
  let h = '<section class="sec"><div class="wrap"><h2>Schedule</h2><p class="sub">Today first, then the next two weeks. Tap Book to reserve your spot — if a session is full you can join the waitlist and we’ll email you if a spot opens.</p>' +
    '<div class="seg" style="max-width:360px;margin-bottom:8px">' + [['all', 'All'], ['padel', 'Padel'], ['football', 'Football']].map(x => '<button data-act="sport" data-v="' + x[0] + '" class="' + (S.sport === x[0] ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div>';
  h += feedHTML(list, Array.from({ length: 14 }, (_, i) => addDays(t, i)), t, { sport: S.sport });
  return h + '</div></section>';
}
function openBook(id) {
  const s = S._sess[id]; if (!s) return;
  if (!S.user) { S.after = 'schedule'; toast('Sign in or create an account to book'); go('signin'); return; }
  if (S.staff) return openStaffAdd(id);
  if (S.profile && !S.profile.email_verified) { toast('Please confirm your email first — check your inbox, or resend the link from the banner above', true); return; }
  const member = !!(S.membership && S.membership.active);
  const price = member && s.price_regular != null ? (s.price_member != null ? s.price_member : memberPrice(s.price_regular)) : s.price_regular;
  const full = s.capacity - s.booked <= 0;
  openModal('<button class="x" data-act="close">✕</button><h3>' + esc(s.title) + '</h3><div class="muted">' + esc(fmtDay(s.date)) + ' · ' + esc(range(s.start_time, s.end_time)) + '</div>' +
    (s.description ? '<p class="small" style="margin:10px 0">' + esc(s.description) + '</p>' : '') +
    (full ? '<div class="note" style="margin:10px 0">This session is full — you’ll go on the waitlist and get an email if a spot opens.</div>' : '') +
    ((s.levels || []).length ? '<div class="field" style="margin-top:12px"><span>YOUR LEVEL</span><div class="lvseg" id="bk-level">' + s.levels.map(l => '<button data-act="pick" data-v="' + esc(l) + '">' + esc(l) + '</button>').join('') + '</div></div>' : '') +
    '<label class="field" style="margin-top:12px"><span>PLAYERS</span><select id="bk-players" class="inp">' + [1, 2, 3, 4].map(n => '<option>' + n + '</option>').join('') + '</select></label>' +
    '<div class="field"><span>PAYMENT</span><div class="seg" id="bk-pay"><button data-act="pay" data-v="club" class="on">Pay at the club</button><button data-act="pay" data-v="gcash">GCash</button></div></div>' +
    '<label class="field hide" id="bk-gc"><span>GCASH REFERENCE NO.</span><input id="bk-ref" class="inp" placeholder="Send to 0917 125 5048, then enter the ref no."></label>' +
    '<label class="field"><span>NOTES (optional)</span><textarea id="bk-notes" class="inp" placeholder="Level, names of friends you’re bringing, kid’s age…"></textarea></label>' +
    '<div class="row between" style="margin:6px 0 14px"><span class="muted">' + (price != null ? 'Price per player' + (member ? ' (member)' : '') : 'Price') + '</span><b>' + (price != null ? esc(peso(price)) : 'Confirmed at the club') + '</b></div>' +
    '<button class="btn b-gold b-full" data-act="dobook" data-id="' + s.id + '">' + (full ? 'Join waitlist' : 'Confirm booking') + '</button>');
}

    '<div class="prog" style="grid-template-columns:1fr 1fr"><input class="mini" id="sa-name" placeholder="Walk-in name"><input class="mini" id="sa-phone" placeholder="Mobile (optional)"></div>' +

/* ---------- modal ---------- */
function openModal(html) { $('modal').innerHTML = '<div class="modal" data-act="bg"><div class="box">' + html + '</div></div>'; }
function closeModal() { $('modal').innerHTML = ''; }

/* ---------- actions ---------- */
async function run(fn, ok) {
  if (S.busy) return; S.busy = true;
  try { await fn(); if (ok) toast(ok); } catch (e) { toast(errMsg(e), true); }
  S.busy = false;
}
const must = r => { if (r.error) throw r.error; return r.data; };
const num = v => v === '' || v == null ? null : Number(v);

document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  if (a === 'bg' && ev.target !== b) return;
  if (b.tagName === 'A' && a === 'signout') ev.preventDefault();
  switch (a) {
    case 'burger': $('links').classList.toggle('open'); break;
    case 'bg': case 'close': closeModal(); break;
    case 'signout': await sb.auth.signOut(); await loadUser(); toast('Signed out'); go(''); break;
    case 'regtab': signTab = 'up'; break;
    case 'stab': signTab = v; route(); break;
    case 'signin': run(async () => {
      const email = $('su-email').value.trim(), password = $('su-pass').value;
      must(await sb.auth.signInWithPassword({ email, password })); await loadUser(); go(S.staff ? 'staff' : (S.after || 'account')); S.after = null;
    }, 'Welcome back!'); break;
    case 'signup': run(async () => {
      const full_name = $('su-name').value.trim(), nickname = $('su-nick').value.trim() || full_name.split(' ')[0], phone = $('su-phone').value.trim(), email = $('su-email').value.trim(), password = $('su-pass').value;
      if (!full_name) throw new Error('Please enter your name'); if (password.length < 8) throw new Error('Password must be at least 8 characters');
      const r = must(await sb.auth.signUp({ email, password, options: { data: { full_name, nickname, phone, membership: !!$('su-member').checked, family: readFamily() }, emailRedirectTo: location.origin + location.pathname } }));
      if (!r.session) { toast('Check your email to confirm your account'); return; }
      await loadUser(); S.after = null; signTab = 'sent'; S._sentTo = email; go('signin');
    }); break;
    case 'sport': S.sport = v; route(); break;
    case 'book': openBook(id); break;
    case 'pay': { b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); $('bk-gc').classList.toggle('hide', v !== 'gcash'); break; }
    case 'resendverify': run(async () => { must(await sb.rpc('uzu_resend_verification')); }, 'Sent — check your inbox'); break;
    case 'paysubmit': run(async () => {
      const f = $('pp-file').files[0]; if (!f) throw new Error('Please attach your receipt or screenshot'); if (f.size > 8 * 1024 * 1024) throw new Error('File is over 8 MB');
      const path = 'invite/' + S.arg + '/' + Date.now() + '-' + f.name.replace(/[^A-Za-z0-9._-]+/g, '_');
      must(await sb.storage.from('uzu-proofs').upload(path, f, { contentType: f.type || undefined }));
      must(await sb.rpc('uzu_submit_invite_payment', { p_token: S.arg, p_path: path, p_method: $('pp-method').value, p_reference: $('pp-ref').value, p_paid_on: $('pp-date').value || null }));
      await route();
    }, 'Thank you — proof received'); break;
    case 'staffadd': openStaffAdd(id); break;
    case 'dostaffadd': run(async () => {
      const w = $('sa-who').value.trim(); const acct = w && (S._people.accounts.find(p => (p.email || '').toLowerCase() === w.toLowerCase()));
      if (w && !acct && w.includes('@') && !$('sa-name').value.trim()) throw new Error('No account with that email — add a walk-in name too');
      const r = must(await sb.rpc('uzu_staff_add_guest', { p_session: id, p_name: acct ? null : ($('sa-name').value.trim() || w), p_phone: $('sa-phone').value, p_email: acct ? null : (w.includes('@') ? w : null), p_players: 1, p_level: ((document.querySelector('#sa-level .on') || {}).dataset || {}).v || null, p_user: acct ? acct.id : null }));
      closeModal(); S._people = null; await route(); toast(r.status === 'waitlist' ? 'Added to the waitlist' : 'Player added');
    }); break;
    case 'pick': b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'dobook': run(async () => {
      if (document.querySelector('#bk-level') && !document.querySelector('#bk-level .on')) throw new Error('Please choose your level');
      const pay = (document.querySelector('#bk-pay .on') || {}).dataset.v || 'club';
      const r = must(await sb.rpc('uzu_book_session', { p_session: id, p_players: +$('bk-players').value, p_pay_method: pay, p_gcash_ref: ($('bk-ref') || {}).value || '', p_notes: $('bk-notes').value, p_level: ((document.querySelector('#bk-level .on') || {}).dataset || {}).v || null }));
      closeModal(); await route();
      toast(r.status === 'waitlist' ? 'You’re on the waitlist — we’ll email you if a spot opens' : 'Booked! Confirmation sent to your email (ref ' + r.ref + ')');
    }); break;
    case 'cancel': if (!confirmTwice(b)) return; run(async () => { must(await sb.rpc('uzu_cancel_my_booking', { p_id: id })); await route(); }, 'Booking cancelled'); break;
    case 'court': S.courtId = id; S.courtStart = null; route(); break;
    case 'cdate': S.courtDate = v; S.courtStart = null; route(); break;
    case 'cslot': S.courtStart = +v; route(); break;
    case 'dobookcourt': if (!S.user) { S.after = 'courts'; go('signin'); return; } run(async () => {
      const pay = (document.querySelector('#bk-pay .on') || {}).dataset.v || 'club';
      const r = must(await sb.rpc('uzu_book_court', { p_court: S.courtId, p_date: S.courtDate, p_start: tstr(S.courtStart), p_end: tstr(S.courtStart + S.courtDur), p_pay_method: pay, p_gcash_ref: ($('bk-ref') || {}).value || '', p_notes: $('bk-notes').value }));
      S.courtStart = null; await route(); toast('Request sent (ref ' + r.ref + '). We’ll email you once staff confirm.');
    }); break;
    case 'saveprofile': run(async () => { must(await sb.rpc('uzu_update_profile', { p_name: $('pf-name').value, p_phone: $('pf-phone').value, p_nickname: $('pf-nick').value })); await loadUser(); }, 'Saved'); break;
    // staff
    case 'stafftab': S.staffTab = v; if (location.hash !== '#staff') { location.hash = 'staff'; } else route(); break;
    case 'sday': S.staffDate = addDays(S.staffDate, +v); route(); break;
    case 'roster': S.staffTab = 'today'; S.staffDate = v; route(); window.scrollTo(0, 0); break;
    case 'bkf': S.bkFilter = v; route(); break;
    case 'bset': if (v === 'cancelled' && !confirmTwice(b)) return; run(async () => { must(await sb.from('uzu_bookings').update({ status: v, updated_at: new Date().toISOString() }).eq('id', id)); await route(); }, v === 'confirmed' ? 'Confirmed — player notified by email' : 'Cancelled — player notified'); break;
    case 'bpaid': run(async () => { must(await sb.from('uzu_bookings').update({ payment: v, updated_at: new Date().toISOString() }).eq('id', id)); await route(); }, v === 'paid' ? 'Marked paid' : 'Marked unpaid'); break;
    case 'addguest': run(async () => { must(await sb.rpc('uzu_staff_add_guest', { p_session: id, p_name: $('g-n-' + id).value, p_phone: $('g-p-' + id).value, p_email: $('g-e-' + id).value, p_players: 1, p_level: ($('g-l-' + id) || {}).value || null, p_user: null })); S._people = null; await route(); }, 'Player added'); break;
    case 'addsession': run(async () => {
      const courtsSel = [...document.querySelectorAll('.os-court:checked')].map(x => x.value);
      const title = $('os-title').value.trim(); if (!title) throw new Error('Add a title');
      must(await sb.from('uzu_sessions').insert({ title, sport: $('os-sport').value, date: $('os-date').value, start_time: $('os-start').value, end_time: $('os-end').value, capacity: +$('os-cap').value || 12, price_regular: num($('os-price').value), audience: $('os-aud').value || null, court_ids: courtsSel }));
      await route();
    }, 'Session added'); break;
    case 'gensessions': run(async () => { const n = must(await sb.rpc('uzu_ensure_sessions', { p_weeks: 6 })); await route(); toast(n ? n + ' new sessions added' : 'Already up to date'); }); break;
    case 'saveprog': run(async () => {
      const card = b.closest('[data-prog]'); const pid = card.dataset.prog; const f = k => card.querySelector('[data-f="' + k + '"]');
      const row = { title: f('title').value.trim(), dow: +f('dow').value, start_time: f('start_time').value, end_time: f('end_time').value, audience: f('audience').value || null, sport: f('sport').value, capacity: +f('capacity').value || 12, price_regular: num(f('price_regular').value), price_member: num(f('price_member').value), description: f('description').value || null, active: f('active').checked, court_ids: [...card.querySelectorAll('[data-court]:checked')].map(x => x.value) };
      if (!row.title || !row.start_time || !row.end_time) throw new Error('Title, start and end are required');
      if (pid) must(await sb.from('uzu_programs').update(row).eq('id', pid));
      else must(await sb.from('uzu_programs').insert(Object.assign({ id: row.title.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + row.dow + '-' + Date.now().toString(36), sort: 99 }, row)));
      cache.programs = null; await sb.rpc('uzu_ensure_sessions', { p_weeks: 6 }); await route();
    }, 'Weekly schedule saved'); break;
    case 'savecourt': run(async () => {
      const card = b.closest('[data-courtrow]'); const f = k => card.querySelector('[data-f="' + k + '"]');
      must(await sb.from('uzu_courts').update({ name: f('name').value, hourly_rate: num(f('hourly_rate').value), open_time: f('open_time').value, close_time: f('close_time').value, active: f('active').checked }).eq('id', card.dataset.courtrow));
      cache.courts = null; await route();
    }, 'Court saved'); break;
    case 'smode': S.sheetMode = v; route(); break;
    case 'stoday': S.sheetDate = manilaToday(); route(); break;
    case 'courtday': S.courtDate = v; break;
    case 'sstep': S.sheetDate = addDays(S.sheetDate, (+v) * (S.sheetMode === 'week' ? 7 : 1)); route(); break;
    case 'sheetcopy': try { await navigator.clipboard.writeText(S._sheetText || ''); toast('Summary copied'); } catch (e) { openModal('<button class="x" data-act="close">✕</button><h3>Summary</h3><textarea class="inp" style="min-height:300px">' + esc(S._sheetText || '') + '</textarea>'); } break;
    case 'staffcourt': run(async () => { must(await sb.rpc('uzu_staff_book_court', { p_court: $('sc-court').value, p_date: $('sc-date').value, p_start: $('sc-start').value, p_end: $('sc-end').value, p_name: $('sc-name').value, p_phone: $('sc-phone').value, p_user: null })); await route(); }, 'Court booked'); break;
    case 'mmanage': openMember(id); break;
    case 'peoplef': S.peopleF = v; S.staffTab = 'people'; if (S.route !== 'staff') go('staff'); else route(); break;
    case 'linkguest': run(async () => { const n = must(await sb.rpc('uzu_staff_link_guest', { p_key: v, p_user: id })); S._people = null; closeModal(); await route(); toast(n + ' booking' + (n === 1 ? '' : 's') + ' merged'); }); break;
    case 'mverify': run(async () => { must(await sb.rpc('uzu_staff_mark_verified', { p_user: id })); await openMember(id); }, 'Marked as verified'); break;
    case 'minvite': run(async () => { const i = must(await sb.rpc('uzu_staff_invite_member', { p_user: id, p_amount: num($('mi-amount').value) || 2000, p_months: +$('mi-months').value || 6, p_message: $('mi-msg').value })); await openMember(id); try { await navigator.clipboard.writeText(SITE + '#pay/' + i.token); } catch (e) { } }, 'Invitation emailed — link also copied'); break;
    case 'mcopyinv': try { await navigator.clipboard.writeText(SITE + '#pay/' + v); toast('Invite link copied — paste it in WhatsApp or Messenger'); } catch (e) { prompt('Copy this link', SITE + '#pay/' + v); } break;
    case 'mtoggle': run(async () => { const on = v === 'on'; must(await sb.rpc('uzu_staff_set_membership', { p_user: id, p_on: on, p_until: on ? ($('mt-until').value || null) : null, p_plan: on ? ($('mt-plan').value || null) : null, p_note: $('mt-note').value || null })); await openMember(id); route(); }, v === 'on' ? 'Membership on' : 'Membership off'); break;
    case 'mreview': run(async () => { must(await sb.rpc('uzu_staff_review_payment', { p_id: id, p_approve: v === 'yes', p_note: ($('rv-' + id) || {}).value || null })); const uid = b.dataset.u; await openMember(uid); route(); }, v === 'yes' ? 'Approved — membership active' : 'Marked as not accepted — player emailed'); break;
    case 'reqmember': run(async () => { must(await sb.rpc('uzu_request_membership')); await loadUser(); await route(); }, 'Request sent — see you at the club!'); break;
    case 'savefamily': run(async () => { must(await sb.rpc('uzu_set_family', { p_family: readFamily($('famwrap')) })); await route(); }, 'Family members saved'); break;
    case 'msavefam': run(async () => { const list = readFamily($('mfam')); must(await sb.from('uzu_family').delete().eq('primary_id', id)); if (list.length) must(await sb.from('uzu_family').insert(list.map(f => ({ primary_id: id, name: f.name, relation: f.relation, email: f.email || null })))); }, 'Family saved'); break;
    case 'msave': run(async () => { must(await sb.from('uzu_profiles').update({ member_plan: $('m-plan').value || null, is_member: $('m-active').value === '1', member_since: $('m-since').value || null, member_until: $('m-until').value || null, membership_notes: $('m-notes').value || null }).eq('id', id)); closeModal(); await route(); }, 'Membership saved'); break;
    case 'mpay': run(async () => {
      const f = $('mp-file').files[0]; let path = null;
      if (f) { if (f.size > 8 * 1024 * 1024) throw new Error('File is over 8 MB'); path = id + '/' + Date.now() + '-' + f.name.replace(/[^A-Za-z0-9._-]+/g, '_'); must(await sb.storage.from('uzu-proofs').upload(path, f, { contentType: f.type || undefined })); }
      must(await sb.from('uzu_member_payments').insert({ user_id: id, plan: $('mp-plan').value || null, amount: num($('mp-amount').value), paid_on: $('mp-paid').value, method: $('mp-method').value, period_start: $('mp-start').value || null, period_end: $('mp-end').value || null, reference: $('mp-ref').value || null, notes: $('mp-notes').value || null, proof_path: path }));
      S._people = null; await openMember(id); route();
    }, 'Payment saved — membership on'); break;
    case 'proof': run(async () => { const r = must(await sb.storage.from('uzu-proofs').createSignedUrl(v, 600)); window.open(r.signedUrl, '_blank', 'noopener'); }); break;
    case 'retry': run(async () => { must(await sb.rpc('uzu_staff_retry_email', { p_id: +id })); await route(); }, 'Queued again'); break;
    case 'addstaff': run(async () => { must(await sb.rpc('uzu_staff_add', { p_email: $('new-staff').value })); await route(); }, 'Staff added'); break;
    case 'rmstaff': if (!confirmTwice(b)) return; run(async () => { must(await sb.from('uzu_staff').delete().eq('user_id', id)); await route(); }, 'Removed'); break;
    case 'saveinbox': run(async () => { must(await sb.rpc('uzu_staff_set_inbox', { p_email: $('inbox').value })); }, 'Saved'); break;
  }
});
function confirmTwice(b) { if (b.dataset.armed) return true; b.dataset.armed = '1'; const t = b.textContent; b.textContent = 'Tap again'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = t; } }, 3000); return false; }
document.addEventListener('change', ev => {
  const el = ev.target, k = el.dataset.chg; if (!k) return; const id = el.dataset.id;
  if (k === 'cdur') { S.courtDur = +el.value; route(); }
  else if (k === 'sdate') { S.staffDate = el.value; route(); }
  else if (k === 'sheetdate') { S.sheetDate = el.value; route(); }
  else if (k === 'mq') { S.memberQ = el.value; route(); }
  else if (k === 'blevel') run(async () => { must(await sb.rpc('uzu_staff_set_level', { p_booking: id, p_level: el.value })); }, 'Level saved');
  else if (k === 'scap') run(async () => { must(await sb.from('uzu_sessions').update({ capacity: +el.value }).eq('id', id)); await route(); }, 'Capacity updated');
  else if (k === 'sstatus') run(async () => { must(await sb.from('uzu_sessions').update({ status: el.value }).eq('id', id)); await route(); }, 'Session ' + el.value);
  else if (k === 'member') run(async () => { must(await sb.from('uzu_profiles').update({ is_member: el.checked }).eq('id', id)); }, el.checked ? 'Member rate on' : 'Member rate off');
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'su-pass') { const b = document.querySelector('[data-act="signin"],[data-act="signup"]'); if (b) b.click(); } if (ev.key === 'Escape') closeModal(); });
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

/* ---------- boot ---------- */
(async () => {
  sb.rpc('uzu_ensure_sessions', { p_weeks: 6 }).then(() => {}, () => {});
  await loadUser(); route();
})();
})();
</script>
